<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ゴルフ精算帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7F5;
    --card:#FFFFFF;
    --border:#DFDFDA;
    --text:#22221F;
    --text-soft:#8A8A83;
    --accent:#2F6F4F;
    --danger:#B23A2F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:2rem;}
  .num{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  header{
    padding:1.2rem 1.1rem .9rem;
    border-bottom:1px solid var(--border);
  }
  h1{
    margin:0;
    font-size:1.15rem;
    font-weight:700;
  }
  nav{
    display:flex;
    border-bottom:1px solid var(--border);
  }
  nav button{
    flex:1;
    border:none;
    background:transparent;
    padding:.75rem 0;
    font-family:'Noto Sans JP',sans-serif;
    font-size:.82rem;
    font-weight:700;
    color:var(--text-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav button.active{
    color:var(--text);
    border-bottom:2px solid var(--text);
  }
  main{padding:1rem 1.1rem 0;}
  .panel{display:none;}
  .panel.active{display:block;}
  .field-row{
    display:flex;
    gap:.6rem;
    margin-bottom:.9rem;
  }
  .field{flex:1;}
  label.small{
    display:block;
    font-size:.7rem;
    color:var(--text-soft);
    margin-bottom:.3rem;
    font-weight:700;
  }
  input[type="text"],input[type="date"],input[type="number"]{
    width:100%;
    padding:.5rem .55rem;
    border:1px solid var(--border);
    border-radius:4px;
    background:var(--card);
    color:var(--text);
    font-family:'Noto Sans JP',sans-serif;
    font-size:.88rem;
  }
  input[type="number"]{font-family:'IBM Plex Mono',monospace;}
  .player-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:6px;
    padding:.7rem .8rem;
    margin-bottom:.6rem;
  }
  .player-card .pname{
    font-weight:700;
    font-size:.9rem;
    margin:0 0 .5rem;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:.5rem;
    margin-bottom:.6rem;
  }
  .stepper button{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    line-height:1;
  }
  .stepper button:active{background:var(--text);color:var(--card);}
  .stepper .val{
    flex:1;
    text-align:center;
    font-size:1.2rem;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
  }
  .val-wrap{flex:1;text-align:center;}
  .val-par{
    font-size:.72rem;
    color:var(--text-soft);
    margin-top:1px;
  }
  .hc-row{
    display:flex;
    align-items:center;
    gap:.5rem;
    font-size:.78rem;
    color:var(--text-soft);
  }
  .hc-row input{width:64px;padding:.3rem .4rem;font-size:.82rem;}
  hr.divider{
    border:none;
    border-top:1px solid var(--border);
    margin:1rem 0;
  }
  .result-title{
    font-size:.72rem;
    font-weight:700;
    color:var(--text-soft);
    margin:0 0 .5rem;
  }
  .rank-list{
    margin-bottom:.7rem;
  }
  .rank-row{
    display:flex;
    align-items:center;
    gap:.7rem;
    padding:.65rem 0;
    border-bottom:1px solid var(--border);
  }
  .rank-row:first-child{border-top:1px solid var(--border);}
  .rank-num{
    width:1.4rem;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    color:var(--text-soft);
    font-size:.85rem;
  }
  .rank-info{flex:1;}
  .rank-name{font-weight:700;font-size:.88rem;}
  .rank-sub{font-size:.7rem;color:var(--text-soft);}
  .rank-amount{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:1rem;
  }
  .rank-amount.plus{color:var(--accent);}
  .rank-amount.minus{color:var(--danger);}
  details.breakdown{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:4px;
    padding:.5rem .7rem;
    margin-bottom:.9rem;
  }
  details.breakdown summary{
    font-size:.76rem;
    font-weight:700;
    color:var(--text-soft);
    cursor:pointer;
  }
  .bd-line{
    display:flex;
    justify-content:space-between;
    font-size:.8rem;
    padding:.35rem 0;
    border-top:1px solid var(--border);
  }
  .bd-line .num{font-size:.82rem;}
  button.primary{
    width:100%;
    padding:.75rem;
    border:none;
    border-radius:5px;
    background:var(--text);
    color:var(--card);
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }
  button.primary:active{opacity:.8;}
  button.ghost{
    width:100%;
    padding:.6rem;
    border:1px solid var(--border);
    border-radius:5px;
    background:transparent;
    color:var(--text-soft);
    font-weight:700;
    font-size:.78rem;
    cursor:pointer;
    margin-top:.5rem;
  }
  .toast{
    position:fixed;
    bottom:1.2rem;left:50%;
    transform:translateX(-50%);
    background:var(--text);
    color:var(--card);
    padding:.55rem 1rem;
    border-radius:5px;
    font-size:.8rem;
    opacity:0;
    transition:opacity .25s;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;}
  .history-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:6px;
    margin-bottom:.6rem;
    overflow:hidden;
  }
  .history-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:.6rem .75rem;
    cursor:pointer;
  }
  .history-head .hdate{font-weight:700;font-size:.85rem;}
  .history-head .hcourse{font-size:.7rem;color:var(--text-soft);}
  .history-chips{
    display:flex;
    gap:.4rem;
    padding:0 .75rem .6rem;
    flex-wrap:wrap;
  }
  .hchip{
    font-family:'IBM Plex Mono',monospace;
    font-size:.68rem;
    font-weight:600;
    padding:.15rem .4rem;
    border-radius:3px;
    background:var(--bg);
    border:1px solid var(--border);
  }
  .hchip.plus{color:var(--accent);}
  .hchip.minus{color:var(--danger);}
  .history-detail{
    display:none;
    padding:.2rem .75rem .75rem;
    border-top:1px solid var(--border);
  }
  .history-detail.open{display:block;}
  .hrow{
    display:flex;
    justify-content:space-between;
    font-size:.76rem;
    padding:.3rem 0;
    border-bottom:1px solid var(--border);
  }
  .del-btn{
    margin-top:.5rem;
    background:none;
    border:none;
    color:var(--danger);
    font-size:.74rem;
    font-weight:700;
    cursor:pointer;
    padding:.3rem 0;
  }
  .empty{
    text-align:center;
    color:var(--text-soft);
    font-size:.85rem;
    padding:2.5rem 1rem;
  }
  .settings-row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:5px;
    padding:.65rem .75rem;
    margin-bottom:.55rem;
  }
  .section-label{
    font-size:.7rem;
    font-weight:700;
    color:var(--text-soft);
    margin:1.1rem 0 .5rem;
  }
  .loading{text-align:center;padding:3rem 1rem;color:var(--text-soft);}
  input[type="file"]{
    width:100%;
    font-size:.78rem;
    color:var(--text-soft);
    margin-top:.3rem;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ゴルフ精算帖</h1>
  </header>
  <nav>
    <button data-tab="entry" class="active">今日の精算</button>
    <button data-tab="history">履歴</button>
    <button data-tab="settings">設定</button>
  </nav>
  <main>
    <div id="loading" class="loading">読み込み中…</div>

    <section class="panel active" id="panel-entry">
      <div class="field-row">
        <div class="field">
          <label class="small">日付</label>
          <input type="date" id="round-date">
        </div>
        <div class="field">
          <label class="small">コース名</label>
          <input type="text" id="round-course" placeholder="コース名">
        </div>
      </div>
      <hr class="divider">
      <div id="player-inputs"></div>
      <div class="result-title">精算結果（順位順）</div>
      <div class="rank-list" id="rank-list"></div>
      <details class="breakdown">
        <summary>内訳を見る</summary>
        <div id="breakdown-body"></div>
      </details>
      <div class="field-row">
        <button class="ghost" id="copy-image-btn" style="margin-top:0;">画像でコピー</button>
        <button class="ghost" id="copy-text-btn" style="margin-top:0;">テキストでコピー</button>
      </div>
      <button class="primary" id="save-round">履歴に保存する</button>
    </section>

    <section class="panel" id="panel-history">
      <div id="history-list"></div>
    </section>

    <section class="panel" id="panel-settings">
      <div class="section-label">プレイヤー名（4人固定）</div>
      <div id="settings-players"></div>
      <div class="section-label">レート</div>
      <div class="settings-row">
        <label class="small">1打差あたりの金額（円）</label>
        <input type="number" id="settings-rate" value="100">
      </div>
      <div class="section-label">既定のコース名</div>
      <div class="settings-row">
        <label class="small">入力時に自動で入る名前</label>
        <input type="text" id="settings-default-course">
      </div>
      <button class="primary" id="save-settings">設定を保存する</button>
      <div class="section-label">データのバックアップ</div>
      <div class="settings-row">
        <p style="font-size:.78rem;color:var(--text-soft);margin:0 0 .6rem;">端末やChromeのデータが消えた場合に備えて、バックアップファイルを保存しておくことをおすすめします。</p>
        <button class="ghost" id="export-btn" style="margin-top:0;">データをバックアップ（ダウンロード）</button>
        <label class="small" style="margin-top:.8rem;">バックアップから復元</label>
        <input type="file" id="import-input" accept="application/json">
      </div>
      <button class="ghost" id="reset-history">履歴をすべて削除する</button>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const DEFAULT_SETTINGS = {
  players: [
    {name:"プレイヤー1"},
    {name:"プレイヤー2"},
    {name:"プレイヤー3"},
    {name:"プレイヤー4"}
  ],
  rate: 100,
  defaultCourse: "ニッソーカントリークラブ"
};
const DEFAULT_SCORE = 45;

let settings = null;
let rounds = [];
let entryScores = [DEFAULT_SCORE,DEFAULT_SCORE,DEFAULT_SCORE,DEFAULT_SCORE];
let entryHc = [0,0,0,0];

const PAR = 36;

function parLabel(score){
  const diff = score - PAR;
  if(diff===0) return 'E';
  return diff>0 ? ('+'+diff) : String(diff);
}

function todayStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function storageGet(key){
  try{
    const v = localStorage.getItem(key);
    return v===null ? null : {value:v};
  }catch(e){
    return null;
  }
}

function storageSet(key, value){
  try{
    localStorage.setItem(key, value);
    return true;
  }catch(e){
    return false;
  }
}

async function loadSettings(){
  const r = storageGet('golf_settings');
  if(!r) return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  const s = JSON.parse(r.value);
  if(s.defaultCourse===undefined) s.defaultCourse = DEFAULT_SETTINGS.defaultCourse;
  return s;
}

async function loadRounds(){
  const r = storageGet('golf_rounds');
  return r ? JSON.parse(r.value) : [];
}

async function saveSettingsToStorage(){
  return storageSet('golf_settings', JSON.stringify(settings));
}

async function saveRoundsToStorage(){
  return storageSet('golf_rounds', JSON.stringify(rounds));
}

function computeSettlement(players){
  const nets = players.map(p => p.gross - p.hc);
  const totals = [0,0,0,0];
  const pairs = [];
  for(let i=0;i<4;i++){
    for(let j=i+1;j<4;j++){
      const diff = nets[j]-nets[i];
      const amount = diff*settings.rate;
      totals[i]+=amount;
      totals[j]-=amount;
      if(amount!==0) pairs.push({i,j,amount});
    }
  }
  return {nets, totals, pairs};
}

function yen(n){
  const sign = n>0?"+":n<0?"-":"";
  return sign+Math.abs(Math.round(n)).toLocaleString()+"円";
}

function renderPlayerInputs(){
  const wrap = document.getElementById('player-inputs');
  wrap.innerHTML = "";
  settings.players.forEach((p,idx)=>{
    const card = document.createElement('div');
    card.className = 'player-card';
    card.innerHTML = `
      <p class="pname">${p.name}</p>
      <div class="stepper">
        <button type="button" data-act="minus" data-idx="${idx}">−</button>
        <div class="val-wrap">
          <div class="val num" id="score-val-${idx}">${entryScores[idx]}</div>
          <div class="val-par num" id="score-par-${idx}">${parLabel(entryScores[idx])}</div>
        </div>
        <button type="button" data-act="plus" data-idx="${idx}">＋</button>
      </div>
      <div class="hc-row">
        <span>ハンデ</span>
        <input type="number" id="hc-input-${idx}" value="${entryHc[idx]}">
      </div>
    `;
    wrap.appendChild(card);
  });
  wrap.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx = parseInt(btn.dataset.idx);
      const delta = btn.dataset.act==='plus'?1:-1;
      entryScores[idx] = Math.max(20, Math.min(90, entryScores[idx]+delta));
      document.getElementById('score-val-'+idx).textContent = entryScores[idx];
      document.getElementById('score-par-'+idx).textContent = parLabel(entryScores[idx]);
      renderResult();
    });
  });
  settings.players.forEach((p,idx)=>{
    const hcInput = document.getElementById('hc-input-'+idx);
    hcInput.addEventListener('input',()=>{
      entryHc[idx] = parseFloat(hcInput.value)||0;
      renderResult();
    });
  });
}

function renderResult(){
  const players = settings.players.map((p,idx)=>({name:p.name, gross:entryScores[idx], hc:entryHc[idx]}));
  const {nets, totals, pairs} = computeSettlement(players);
  const order = [0,1,2,3].slice().sort((a,b)=>nets[a]-nets[b]);

  const list = document.getElementById('rank-list');
  list.innerHTML = "";
  order.forEach((idx,rank)=>{
    const p = players[idx];
    const t = totals[idx];
    const cls = t>0?'plus':t<0?'minus':'';
    const row = document.createElement('div');
    row.className = 'rank-row';
    row.innerHTML = `
      <div class="rank-num">${rank+1}</div>
      <div class="rank-info">
        <div class="rank-name">${p.name}</div>
        <div class="rank-sub">グロス${p.gross}(${parLabel(p.gross)})・HC${p.hc}・ネット${nets[idx]}</div>
      </div>
      <div class="rank-amount num ${cls}">${yen(t)}</div>
    `;
    list.appendChild(row);
  });

  const bd = document.getElementById('breakdown-body');
  bd.innerHTML = "";
  if(pairs.length===0){
    bd.innerHTML = '<div class="bd-line"><span>差はありません</span></div>';
  }else{
    pairs.forEach(pr=>{
      const from = pr.amount>0 ? players[pr.j].name : players[pr.i].name;
      const to = pr.amount>0 ? players[pr.i].name : players[pr.j].name;
      const amt = Math.abs(Math.round(pr.amount));
      const line = document.createElement('div');
      line.className = 'bd-line';
      line.innerHTML = `<span>${from} → ${to}</span><span class="num">${amt.toLocaleString()}円</span>`;
      bd.appendChild(line);
    });
  }
  return {players, nets, totals};
}

function getResultData(){
  const players = settings.players.map((p,idx)=>({name:p.name, gross:entryScores[idx], hc:entryHc[idx]}));
  const {nets, totals} = computeSettlement(players);
  const order = [0,1,2,3].slice().sort((a,b)=>nets[a]-nets[b]);
  return {players, nets, totals, order};
}

function buildResultText(){
  const {players, nets, totals, order} = getResultData();
  const dateVal = document.getElementById('round-date').value || todayStr();
  const courseVal = document.getElementById('round-course').value.trim();
  const lines = [];
  lines.push(dateVal + (courseVal ? ' ' + courseVal : ''));
  order.forEach((idx,rank)=>{
    const p = players[idx];
    lines.push(`${rank+1}位 ${p.name} ${yen(totals[idx])}（グロス${p.gross}(${parLabel(p.gross)})・HC${p.hc}・ネット${nets[idx]}）`);
  });
  return lines.join('\n');
}

function legacyCopyText(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){
    return false;
  }
}

async function copyResultText(){
  const text = buildResultText();
  const hasModernClipboard = window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText;
  if(hasModernClipboard){
    try{
      await navigator.clipboard.writeText(text);
      showToast('テキストをコピーしました');
      return;
    }catch(e){}
  }
  if(legacyCopyText(text)){
    showToast('テキストをコピーしました');
    return;
  }
  window.prompt('コピーできない端末のため、下の内容を全選択してコピーしてください', text);
}

function buildShareCardElement(){
  const {players, nets, totals, order} = getResultData();
  const dateVal = document.getElementById('round-date').value || todayStr();
  const courseVal = document.getElementById('round-course').value.trim();
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:-9999px;top:0;width:360px;background:#ffffff;padding:20px;font-family:"Noto Sans JP",sans-serif;color:#22221F;';
  const rowsHtml = order.map((idx,rank)=>{
    const p = players[idx];
    const t = totals[idx];
    const color = t>0 ? '#2F6F4F' : t<0 ? '#B23A2F' : '#22221F';
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #DFDFDA;">
      <div style="width:20px;font-weight:600;color:#8A8A83;font-size:13px;">${rank+1}</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:14px;">${p.name}</div>
        <div style="font-size:11px;color:#8A8A83;">グロス${p.gross}(${parLabel(p.gross)})・HC${p.hc}・ネット${nets[idx]}</div>
      </div>
      <div style="font-weight:700;font-size:16px;color:${color};font-family:'IBM Plex Mono',monospace;">${yen(t)}</div>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div style="font-size:12px;color:#8A8A83;margin-bottom:4px;">${dateVal}</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:12px;">${courseVal || 'ゴルフ精算帖'}</div>
    ${rowsHtml}
  `;
  document.body.appendChild(el);
  return el;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function copyResultImage(){
  if(typeof html2canvas === 'undefined'){
    showToast('画像コピーが使えないため、テキストでコピーします');
    await copyResultText();
    return;
  }
  const el = buildShareCardElement();
  try{
    const canvas = await html2canvas(el, {backgroundColor:'#ffffff', scale:2});
    if(el.parentNode) document.body.removeChild(el);
    canvas.toBlob(async (blob)=>{
      const canUseClipboardImage = window.isSecureContext && navigator.clipboard && window.ClipboardItem;
      if(canUseClipboardImage){
        try{
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          showToast('画像をコピーしました');
          return;
        }catch(e){}
      }
      downloadBlob(blob, 'golf-result-'+todayStr()+'.png');
      showToast('この端末ではコピーできないため、画像を保存しました');
    });
  }catch(e){
    if(el.parentNode) document.body.removeChild(el);
    showToast('画像の作成に失敗しました。テキストでコピーします');
    copyResultText();
  }
}

async function saveRound(){  const {players, nets, totals} = renderResult();
  const rec = {
    id: Date.now(),
    date: document.getElementById('round-date').value || todayStr(),
    course: document.getElementById('round-course').value.trim(),
    rate: settings.rate,
    players, nets, totals,
    createdAt: Date.now()
  };
  rounds.unshift(rec);
  const ok = await saveRoundsToStorage();
  if(ok){
    showToast('履歴に保存しました');
    renderHistory();
  }else{
    showToast('保存に失敗しました');
  }
}

function renderHistory(){
  const list = document.getElementById('history-list');
  list.innerHTML = "";
  if(rounds.length===0){
    list.innerHTML = '<div class="empty">まだ履歴がありません。<br>ラウンド後に「今日の精算」から保存してください。</div>';
    return;
  }
  rounds.forEach((rec,ri)=>{
    const item = document.createElement('div');
    item.className = 'history-item';
    const sortedIdx = [0,1,2,3].slice().sort((a,b)=>rec.nets[a]-rec.nets[b]);
    const chips = sortedIdx.map(idx=>{
      const p = rec.players[idx];
      const t = rec.totals[idx];
      const cls = t>0?'plus':t<0?'minus':'plus';
      return `<span class="hchip ${cls}">${p.name} ${yen(t)}</span>`;
    }).join('');
    item.innerHTML = `
      <div class="history-head">
        <div>
          <div class="hdate">${rec.date}</div>
          <div class="hcourse">${rec.course || 'コース未記入'}</div>
        </div>
      </div>
      <div class="history-chips">${chips}</div>
      <div class="history-detail" id="hdetail-${ri}">
        ${sortedIdx.map((idx,rank)=>`
          <div class="hrow"><span>${rank+1}. ${rec.players[idx].name}（グロス${rec.players[idx].gross}(${parLabel(rec.players[idx].gross)})・HC${rec.players[idx].hc}・ネット${rec.nets[idx]}）</span><span class="num">${yen(rec.totals[idx])}</span></div>
        `).join('')}
        <button class="del-btn" data-ri="${ri}">この履歴を削除</button>
      </div>
    `;
    list.appendChild(item);
    item.querySelector('.history-head').addEventListener('click',()=>{
      document.getElementById('hdetail-'+ri).classList.toggle('open');
    });
  });
  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ri = parseInt(btn.dataset.ri);
      if(confirm('この履歴を削除しますか？')){
        rounds.splice(ri,1);
        await saveRoundsToStorage();
        renderHistory();
        showToast('削除しました');
      }
    });
  });
}

function renderSettings(){
  const wrap = document.getElementById('settings-players');
  wrap.innerHTML = "";
  settings.players.forEach((p,idx)=>{
    const row = document.createElement('div');
    row.className = 'settings-row';
    row.innerHTML = `
      <label class="small">プレイヤー${idx+1}</label>
      <input type="text" id="set-name-${idx}" value="${p.name}">
    `;
    wrap.appendChild(row);
  });
  document.getElementById('settings-rate').value = settings.rate;
  document.getElementById('settings-default-course').value = settings.defaultCourse || "";
}

async function saveSettingsFromUI(){
  settings.players.forEach((p,idx)=>{
    const nameInput = document.getElementById('set-name-'+idx);
    p.name = nameInput.value.trim() || p.name;
  });
  settings.rate = parseFloat(document.getElementById('settings-rate').value)||0;
  settings.defaultCourse = document.getElementById('settings-default-course').value.trim();
  const ok = await saveSettingsToStorage();
  if(ok){
    showToast('設定を保存しました');
    renderPlayerInputs();
    renderResult();
    renderHistory();
  }else{
    showToast('保存に失敗しました');
  }
}

function switchTab(tab){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
}

async function requestPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      await navigator.storage.persist();
    }
  }catch(e){}
}

function exportBackup(){
  const data = JSON.stringify({settings, rounds}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'golf-seisancho-backup-'+todayStr()+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('バックアップをダウンロードしました');
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.settings) settings = data.settings;
      if(data.rounds) rounds = data.rounds;
      await saveSettingsToStorage();
      await saveRoundsToStorage();
      entryHc = [0,0,0,0];
      document.getElementById('round-course').value = settings.defaultCourse || "";
      renderPlayerInputs();
      renderResult();
      renderHistory();
      renderSettings();
      showToast('データを復元しました');
    }catch(err){
      showToast('復元に失敗しました。ファイルを確認してください');
    }
  };
  reader.readAsText(file);
}

async function init(){
  await requestPersistentStorage();
  settings = await loadSettings();
  rounds = await loadRounds();
  entryHc = [0,0,0,0];
  document.getElementById('round-date').value = todayStr();
  document.getElementById('round-course').value = settings.defaultCourse || "";
  document.getElementById('loading').style.display = 'none';

  renderPlayerInputs();
  renderResult();
  renderHistory();
  renderSettings();

  document.querySelectorAll('nav button').forEach(btn=>{
    btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
  });
  document.getElementById('save-round').addEventListener('click', saveRound);
  document.getElementById('copy-image-btn').addEventListener('click', copyResultImage);
  document.getElementById('copy-text-btn').addEventListener('click', copyResultText);
  document.getElementById('save-settings').addEventListener('click', saveSettingsFromUI);
  document.getElementById('export-btn').addEventListener('click', exportBackup);
  document.getElementById('import-input').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = "";
  });
  document.getElementById('reset-history').addEventListener('click', async ()=>{
    if(confirm('すべての履歴を削除します。よろしいですか？')){
      rounds = [];
      await saveRoundsToStorage();
      renderHistory();
      showToast('履歴を初期化しました');
    }
  });
}

init();
</script>
</body>
</html>
