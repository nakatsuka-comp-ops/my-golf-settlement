<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>ゴルフ精算 - シングルファイル</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{
      --bg:#f7f7f7;--card:#ffffff;--accent:#1a73e8;--success:#1b8a4a;--danger:#c62828;--muted:#666;
    }
    html,body{height:100%;margin:0;font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;background:var(--bg);color:#111}
    .app{max-width:820px;margin:0 auto;padding:12px}
    header{display:flex;align-items:center;gap:12px}
    h1{font-size:18px;margin:0}
    .tabs{display:flex;gap:8px;margin:12px 0}
    .tab{flex:1;text-align:center;padding:10px 8px;background:var(--card);border-radius:8px;font-weight:600}
    .tab.active{box-shadow:0 1px 0 rgba(0,0,0,0.06);background:#fff;border:2px solid #eee}
    .card{background:var(--card);padding:12px;border-radius:10px;box-shadow:0 1px 0 rgba(0,0,0,0.03);margin-bottom:12px}
    .row{display:flex;gap:8px;align-items:center}
    .col{flex:1}
    label{font-size:12px;color:var(--muted)}
    input[type=text], input[type=number], select{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e6e6;font-size:15px}
    .players{display:flex;flex-direction:column;gap:10px}
    .player{display:flex;gap:8px;align-items:center;padding:10px;border-radius:8px;background:#fafafa}
    .name{width:28%;font-weight:700}
    .controls{display:flex;gap:6px;align-items:center}
    button, .btn{appearance:none;border:0;background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;font-weight:700}
    .btn.secondary{background:#e6e6e6;color:#111}
    .num{background:#fff;padding:6px 10px;border-radius:8px;border:1px solid #eee;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
    .small{font-size:13px;color:var(--muted)}
    .result-list{display:flex;flex-direction:column;gap:8px}
    .result-item{display:flex;gap:8px;padding:10px;border-radius:8px;align-items:center}
    .rank{width:36px;font-size:18px;font-weight:800}
    .money{margin-left:auto;font-weight:800}
    .positive{color:var(--success)}
    .negative{color:var(--danger)}
    .toggle{cursor:pointer;color:var(--muted);font-size:13px}
    .history-item{padding:10px;border-radius:8px;background:#fff;display:flex;flex-direction:column}
    .footer{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
    .icon-btn{background:transparent;border:1px solid #eee;padding:8px;border-radius:8px}
    @media (max-width:600px){.name{width:34%}.num{min-width:56px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>ゴルフ精算アプリ</h1>
    </header>

    <div class="tabs" role="tablist">
      <div id="tab-today" class="tab active" role="tab">今日の精算</div>
      <div id="tab-history" class="tab" role="tab">履歴</div>
      <div id="tab-settings" class="tab" role="tab">設定</div>
    </div>

    <main>
      <!-- 今日の精算 -->
      <section id="pane-today">
        <div class="card">
          <div class="row" style="align-items:center;gap:10px;flex-wrap:wrap">
            <div style="width:48%">
              <label>日付</label>
              <input type="date" id="date" />
            </div>
            <div style="width:52%">
              <label>コース名</label>
              <input type="text" id="course" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="players" id="players">
            <!-- players inserted by JS -->
          </div>
        </div>

        <div class="card">
          <div class="row" style="gap:12px;align-items:center">
            <div class="col">
              <label>1打あたりのレート（円）</label>
              <input type="number" id="rate" min="1" />
            </div>
            <div>
              <label>&nbsp;</label>
              <div style="display:flex;gap:8px">
                <button class="btn" id="calc">精算する</button>
                <button class="btn secondary" id="save-history">履歴に保存</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card" id="result-card" style="display:none">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
            <h2 style="margin:0;font-size:16px">精算結果</h2>
            <div class="small" id="result-summary"></div>
            <div style="margin-left:auto;display:flex;gap:8px">
              <button class="icon-btn" id="copy-text">テキストでコピー</button>
              <button class="icon-btn" id="copy-image">画像でコピー</button>
            </div>
          </div>

          <div id="result-area">
            <div class="result-list" id="result-list"></div>
            <div style="margin-top:8px">
              <div class="toggle" id="toggle-breakdown">内訳を表示</div>
              <div id="breakdown" style="display:none;margin-top:8px"></div>
            </div>
          </div>
        </div>

      </section>

      <!-- 履歴 -->
      <section id="pane-history" style="display:none">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h2 style="margin:0;font-size:16px">履歴</h2>
            <button class="btn secondary" id="clear-history">履歴を全削除</button>
          </div>
        </div>
        <div id="history-list"></div>
      </section>

      <!-- 設定 -->
      <section id="pane-settings" style="display:none">
        <div class="card">
          <h2 style="margin:0 0 8px 0;font-size:16px">プレイヤー名</h2>
          <div id="settings-names" style="display:flex;flex-direction:column;gap:8px"></div>
        </div>

        <div class="card">
          <label>デフォルトコース名</label>
          <input type="text" id="default-course" />
        </div>

        <div class="card">
          <label>デフォルトレート（円）</label>
          <input type="number" id="default-rate" min="1" />
        </div>

        <div class="card">
          <h3 style="margin-top:0">データのバックアップ</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="export-data">データをダウンロード</button>
            <label class="btn secondary" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer">
              バックアップから復元
              <input type="file" id="import-file" accept="application/json" style="display:none" />
            </label>
            <button class="btn secondary" id="delete-all">履歴を全て削除</button>
          </div>
        </div>
      </section>

    </main>

    <div class="footer">このファイルをダウンロードして、Android Chrome の file:// で開いてください。データは端末の localStorage に保存されます。</div>
  </div>

  <script>
  (function(){
    // Keys
    const KEY_SETTINGS = 'golf_settings_v1'
    const KEY_HISTORY = 'golf_history_v1'

    // Default settings
    const defaultSettings = {
      names: ['プレイヤー1','プレイヤー2','プレイヤー3','プレイヤー4'],
      rate: 100,
      defaultCourse: 'ニッソーカントリークラブ'
    }

    // Utils
    function $(id){return document.getElementById(id)}
    function el(tag, cls, text){const d=document.createElement(tag); if(cls) d.className=cls; if(text) d.textContent=text; return d}

    // Persist request
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});}catch(e){}

    // Load settings
    function loadSettings(){
      try{
        const s = JSON.parse(localStorage.getItem(KEY_SETTINGS)||'null')
        return Object.assign({}, defaultSettings, s||{})
      }catch(e){return Object.assign({}, defaultSettings)}
    }
    function saveSettings(s){ localStorage.setItem(KEY_SETTINGS, JSON.stringify(s)) }

    // History
    function loadHistory(){
      try{ return JSON.parse(localStorage.getItem(KEY_HISTORY)||'[]') }catch(e){return []}
    }
    function saveHistory(h){ localStorage.setItem(KEY_HISTORY, JSON.stringify(h)) }

    // Init UI
    const settings = loadSettings()
    let history = loadHistory()

    // Tabs
    function setActiveTab(id){
      ['tab-today','tab-history','tab-settings'].forEach(t=>$(t).classList.remove('active'))
      ['pane-today','pane-history','pane-settings'].forEach(p=>$(p).style.display='none')
      if(id==='today'){ $('tab-today').classList.add('active'); $('pane-today').style.display='' }
      if(id==='history'){ $('tab-history').classList.add('active'); $('pane-history').style.display='' }
      if(id==='settings'){ $('tab-settings').classList.add('active'); $('pane-settings').style.display='' }
    }
    $('tab-today').addEventListener('click',()=>setActiveTab('today'))
    $('tab-history').addEventListener('click',()=>{ renderHistory(); setActiveTab('history') })
    $('tab-settings').addEventListener('click',()=>{ renderSettings(); setActiveTab('settings') })

    // Today pane setup
    function todayInit(){
      const dateInput = $('date');
      const today = new Date().toISOString().slice(0,10)
      dateInput.value = today
      $('course').value = settings.defaultCourse || ''
      $('rate').value = settings.rate || 100

      renderPlayers()

      $('calc').addEventListener('click', calcAll)
      $('save-history').addEventListener('click', ()=>{ if(confirm('このラウンドを履歴に保存しますか？')){ saveCurrentToHistory(); alert('保存しました') } })

      $('copy-text').addEventListener('click', copyTextResult)
      $('copy-image').addEventListener('click', copyImageResult)

      $('toggle-breakdown').addEventListener('click', ()=>{
        const b = $('breakdown'); b.style.display = b.style.display==='none'? 'block' : 'none'
      })
    }

    // Player inputs
    function renderPlayers(){
      const container = $('players'); container.innerHTML=''
      for(let i=0;i<4;i++){
        const p = el('div','player')
        const name = el('div','name'); name.textContent = settings.names[i]||('プレイヤー'+(i+1))
        name.id = 'name-'+i
        const controls = el('div','controls')
        const minus = el('button', 'icon-btn'); minus.textContent='-'
        const plus = el('button', 'icon-btn'); plus.textContent='+'
        const num = el('div','num'); num.id='gross-'+i; num.textContent='45'
        const parDiff = el('div','small'); parDiff.id='pardiff-'+i; parDiff.textContent='差: +9'
        const handi = el('input'); handi.type='number'; handi.min='0'; handi.max='99'; handi.value='0'; handi.id='handi-'+i; handi.style.width='80px'

        minus.addEventListener('click', ()=>{ changeGross(i,-1) })
        plus.addEventListener('click', ()=>{ changeGross(i,1) })
        num.addEventListener('click', ()=>{ // tap to edit quickly
          const val = prompt('グロススコアを入力（20〜90）', num.textContent)
          const n = parseInt(val,10); if(!isNaN(n)) setGross(i, n)
        })

        p.appendChild(name)
        controls.appendChild(minus); controls.appendChild(num); controls.appendChild(plus)
        p.appendChild(controls)
        const right = el('div','col')
        const l1 = el('div','small'); l1.textContent='パー差（9H=36）'
        right.appendChild(l1); right.appendChild(parDiff)
        const l2 = el('div','small'); l2.textContent='ハンデ'; right.appendChild(l2); right.appendChild(handi)
        p.appendChild(right)
        container.appendChild(p)
      }
      // set defaults
      for(let i=0;i<4;i++) setGross(i,45)
    }

    function setGross(i,val){ val = Math.max(20, Math.min(90, parseInt(val)||0)); const elg = $('gross-'+i); elg.textContent = String(val); updateParDiff(i) }
    function changeGross(i,delta){ const elg = $('gross-'+i); setGross(i, (parseInt(elg.textContent)||45) + delta) }
    function updateParDiff(i){ const g = parseInt($('gross-'+i).textContent||'45'); const d = g - 36; const t = d===0? 'E' : (d>0? ('+'+d) : ('-'+Math.abs(d))); $('pardiff-'+i).textContent = t }

    // Calculation
    function calcAll(){
      const players = []
      for(let i=0;i<4;i++){
        const name = settings.names[i]||('プレイヤー'+(i+1))
        const gross = parseInt($('gross-'+i).textContent||'45')
        const handi = parseInt($('handi-'+i).value||'0')
        const net = gross - handi
        players.push({i,name,gross,handi,net,parDiff: (gross-36)})
      }
      const rate = Math.max(1, parseInt($('rate').value||settings.rate||100))

      // pairwise
      const pairs = []
      const totals = Array(4).fill(0)
      for(let a=0;a<4;a++){
        for(let b=a+1;b<4;b++){
          const diff = players[b].net - players[a].net // positive means b worse than a
          const amount = Math.abs(diff) * rate
          if(diff>0){ // b pays a
            totals[a] += amount; totals[b] -= amount
            pairs.push({from:b,to:a,amount,desc: `${players[b].name} → ${players[a].name}: ${amount}円 (${players[b].net} vs ${players[a].net})`})
          }else if(diff<0){ // a pays b
            totals[b] += amount; totals[a] -= amount
            pairs.push({from:a,to:b,amount,desc: `${players[a].name} → ${players[b].name}: ${amount}円 (${players[a].net} vs ${players[b].net})`})
          }else{
            pairs.push({from:null,to:null,amount:0,desc:`${players[a].name} と ${players[b].name} は同ネットで精算なし`})
          }
        }
      }

      // attach totals
      for(let i=0;i<4;i++){ players[i].total = totals[i] }
      // sort by net ascending (better is smaller)
      players.sort((x,y)=> x.net - y.net || x.name.localeCompare(y.name))

      renderResult(players,pairs,rate)
    }

    function renderResult(players,pairs,rate){
      $('result-card').style.display = ''
      const list = $('result-list'); list.innerHTML = ''
      players.forEach((p,idx)=>{
        const item = el('div','result-item card')
        const rank = el('div','rank'); rank.textContent = String(idx+1)
        const name = el('div'); name.innerHTML = `<div style="font-weight:700">${p.name}</div><div class="small">グロス ${p.gross} / ハンデ ${p.handi} / ネット ${p.net} / ${p.parDiff===0?'E':(p.parDiff>0?'+'+p.parDiff:p.parDiff)}</div>`
        const money = el('div','money'); money.textContent = (p.total>=0? '+'+p.total : String(p.total)) + '円'
        money.className = 'money ' + (p.total>0? 'positive' : (p.total<0? 'negative':''))
        item.appendChild(rank); item.appendChild(name); item.appendChild(money)
        list.appendChild(item)
      })

      // summary
      const top = players[0]
      $('result-summary').textContent = `レート ${rate}円 / 1打`

      // breakdown
      const bd = $('breakdown'); bd.innerHTML = ''
      if(pairs.length===0){ bd.textContent = '該当なし' }
      pairs.forEach(p=>{
        const d = el('div'); d.className='small'; d.textContent = p.desc
        bd.appendChild(d)
      })

      // store last result in memory for copy/save
      window.__lastResult = {players,pairs,rate,date:$('date').value,course:$('course').value||settings.defaultCourse}
    }

    // Save current to history
    function saveCurrentToHistory(){
      if(!window.__lastResult){ calcAll() }
      const snapshot = window.__lastResult
      history.unshift(snapshot)
      // keep reasonable length? let user delete
      saveHistory(history)
    }

    // History render
    function renderHistory(){
      const container = $('history-list'); container.innerHTML = ''
      if(history.length===0){ container.appendChild(el('div','card small','履歴がありません')) ; return }
      history.forEach((h,idx)=>{
        const it = el('div','history-item')
        const topLine = el('div','row'); topLine.style.justifyContent='space-between'
        const left = el('div'); left.innerHTML = `<strong>${h.date}</strong> <div class="small">${h.course}</div>`
        const right = el('div'); right.style.display='flex'; right.style.gap='8px'
        const view = el('button','btn secondary'); view.textContent='表示'; view.addEventListener('click',()=>{ showHistoryDetail(idx) })
        const del = el('button','btn'); del.textContent='削除'; del.addEventListener('click',()=>{ if(confirm('この履歴を削除しますか？')){ history.splice(idx,1); saveHistory(history); renderHistory() } })
        right.appendChild(view); right.appendChild(del)
        topLine.appendChild(left); topLine.appendChild(right)
        it.appendChild(topLine)
        container.appendChild(it)
      })
    }

    function showHistoryDetail(idx){ const h = history[idx]; if(!h) return alert('データが見つかりません');
      // create modal-like display using alert-ish? We'll open new window-like small overlay
      const w = window.open('','_blank','width=600,height=800');
      const html = ['<html><head><meta charset="utf-8"><title>履歴詳細</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", Arial;padding:12px} .row{margin-bottom:8px}</style></head><body>']
      html.push(`<h2>${h.date} - ${h.course}</h2>`)
      html.push('<ol>')
      h.players.forEach(p=>{ html.push(`<li>${p.name}: グロス ${p.gross}, ハンデ ${p.handi}, ネット ${p.net}, 精算 ${p.total>=0? '+'+p.total : p.total}円</li>`) })
      html.push('</ol>')
      html.push('<h3>内訳</h3><ul>')
      h.pairs.forEach(p=> html.push(`<li>${p.desc}</li>`))
      html.push('</ul>')
      html.push('</body></html>')
      w.document.write(html.join('\n'))
      w.document.close()
    }

    // Settings
    function renderSettings(){
      const container = $('settings-names'); container.innerHTML=''
      for(let i=0;i<4;i++){
        const row = el('div','row')
        const inp = document.createElement('input'); inp.type='text'; inp.value = settings.names[i]||('プレイヤー'+(i+1)); inp.id = 'set-name-'+i
        inp.addEventListener('change', ()=>{ settings.names[i]=inp.value; saveSettings(settings); renderPlayers(); })
        row.appendChild(inp)
        container.appendChild(row)
      }
      $('default-course').value = settings.defaultCourse||''
      $('default-course').addEventListener('change', ()=>{ settings.defaultCourse = $('default-course').value; saveSettings(settings); })
      $('default-rate').value = settings.rate||100
      $('default-rate').addEventListener('change', ()=>{ settings.rate = parseInt($('default-rate').value||100); saveSettings(settings); })

      // export/import
      $('export-data').onclick = ()=>{
        const data = {settings: settings, history: history}
        const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'})
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a'); a.href = url; a.download = 'golf_backup_'+(new Date().toISOString().slice(0,10))+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url)
      }
      $('import-file').onchange = (e)=>{
        const f = e.target.files && e.target.files[0]; if(!f) return
        const reader = new FileReader(); reader.onload = ()=>{
          try{
            const data = JSON.parse(reader.result)
            if(data.settings) settings.names = data.settings.names||settings.names; settings.rate = data.settings.rate||settings.rate; settings.defaultCourse = data.settings.defaultCourse||settings.defaultCourse
            if(data.history) history = data.history
            saveSettings(settings); saveHistory(history); alert('復元しました'); renderPlayers(); renderHistory();
          }catch(err){ alert('ファイルの読み込みに失敗しました') }
        }
        reader.readAsText(f)
      }

      $('delete-all').onclick = ()=>{ if(confirm('履歴を全て削除します。本当によいですか？')){ history = []; saveHistory(history); renderHistory(); alert('履歴を削除しました') } }
    }

    // Copy text with fallbacks
    function copyTextResult(){
      if(!window.__lastResult) return alert('先に精算してください')
      const r = window.__lastResult
      let lines = []
      lines.push(`${r.date} ${r.course}`)
      lines.push('順位	名前	グロス	ハンデ	ネット	受取/支払')
      r.players.forEach((p,idx)=>{ lines.push(`${idx+1}	${p.name}	${p.gross}	${p.handi}	${p.net}	${p.total>=0? '+'+p.total : p.total}円`) })
      lines.push('内訳:')
      r.pairs.forEach(p=> lines.push(p.desc))
      const txt = lines.join('\n')

      // try navigator.clipboard
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>{ alert('結果をクリップボードにコピーしました') }).catch(()=> fallbackCopyText(txt))
      }else fallbackCopyText(txt)
    }
    function fallbackCopyText(txt){
      // execCommand
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try{
        const ok = document.execCommand('copy')
        document.body.removeChild(ta)
        if(ok){ alert('結果をクリップボードにコピーしました（execCommand）') } else { window.prompt('以下のテキストを手動でコピーしてください（Ctrl+C / 長押し）', txt) }
      }catch(e){ document.body.removeChild(ta); window.prompt('以下のテキストを手動でコピーしてください', txt) }
    }

    // Copy image with fallback
    async function copyImageResult(){
      if(!window.__lastResult) return alert('先に精算してください')
      const area = $('result-area')
      try{
        const canvas = await html2canvas(area, {scale: window.devicePixelRatio || 2})
        canvas.toBlob(async function(blob){
          if(!blob) return downloadBlobFallback(canvas)
          // try clipboard write
          try{
            if(navigator.clipboard && navigator.clipboard.write){
              const item = new ClipboardItem({ [blob.type]: blob })
              await navigator.clipboard.write([item])
              alert('画像をクリップボードにコピーしました')
            }else{
              downloadBlobFallback(canvas)
            }
          }catch(e){ downloadBlobFallback(canvas) }
        })
      }catch(e){ alert('画像化に失敗しました'); console.error(e) }
    }
    function downloadBlobFallback(canvas){
      const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = 'golf_result_'+(new Date().toISOString().slice(0,19).replace(/[:T]/g,'-'))+'.png'; document.body.appendChild(a); a.click(); a.remove(); alert('画像をダウンロードしました。手動で共有してください')
    }

    // Save to history wrapper: include players & pairs
    function prepareSnapshot(){
      // recalc players from DOM to ensure consistency
      const players = []
      for(let i=0;i<4;i++){
        players.push({ name: settings.names[i]||('プレイヤー'+(i+1)), gross: parseInt($('gross-'+i).textContent||'45'), handi: parseInt($('handi-'+i).value||'0') })
      }
      const rate = parseInt($('rate').value||settings.rate||100)
      // compute nets and pairs same as calcAll
      players.forEach(p=> p.net = p.gross - p.handi)
      const pairs = []
      const totals = Array(4).fill(0)
      for(let a=0;a<4;a++) for(let b=a+1;b<4;b++){
        const diff = players[b].net - players[a].net
        const amount = Math.abs(diff)*rate
        if(diff>0){ totals[a]+=amount; totals[b]-=amount; pairs.push({from:players[b].name,to:players[a].name,amount,desc: `${players[b].name} → ${players[a].name}: ${amount}円 (${players[b].net} vs ${players[a].net})`}) }
        else if(diff<0){ totals[b]+=amount; totals[a]-=amount; pairs.push({from:players[a].name,to:players[b].name,amount,desc:`${players[a].name} → ${players[b].name}: ${amount}円 (${players[a].net} vs ${players[b].net})`}) }
        else pairs.push({desc:`${players[a].name} と ${players[b].name} は同ネットで精算なし`})
      }
      players.forEach((p,i)=> p.total = totals[i])
      players.sort((x,y)=> x.net - y.net)
      return { date:$('date').value, course:$('course').value||settings.defaultCourse, rate, players, pairs }
    }

    function saveCurrentToHistory(){
      const snap = prepareSnapshot()
      history.unshift(snap)
      saveHistory(history)
      window.__lastResult = snap
    }

    // the above saveCurrentToHistory shadowed before; ensure binding

    // Global expose for debugging
    window.golfApp = { loadSettings, saveSettings, loadHistory, saveHistory }

    // attach initial
    todayInit()
    renderSettings()
    renderHistory()

    // Ensure functions for export (some duplicates resolved)
    window.calcAll = calcAll
    window.saveCurrentToHistory = saveCurrentToHistory

  })()
  </script>
